name: Deploy to Cloud Run

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  # Change these if you rename the GCP project / region / service.
  PROJECT_ID: glafira-se
  # Project number, used to build the public Cloud Run URL. To look it up:
  #   gcloud projects describe glafira-se --format='value(projectNumber)'
  PROJECT_NUMBER: "364590748641"
  REGION: europe-west1
  SERVICE: skillup

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Authorize Docker push to Artifact Registry
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Ensure Artifact Registry repository
        run: |
          gcloud artifacts repositories describe "$SERVICE" --location="$REGION" >/dev/null 2>&1 \
            || gcloud artifacts repositories create "$SERVICE" \
                 --repository-format=docker \
                 --location="$REGION" \
                 --description="SkillUp images"

      - name: Build and push image
        run: |
          SITE_URL="https://$SERVICE-$PROJECT_NUMBER.$REGION.run.app"
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE }}/${{ env.SERVICE }}:${{ github.sha }}
          echo "Building client for $SITE_URL"
          docker build --build-arg VITE_API_URL="$SITE_URL" -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}
          flags: |
            --allow-unauthenticated
            --memory=512Mi
          env_vars: |
            MongoDBSettings__ConnectionString=${{ secrets.MONGO_CONNECTION_STRING }}
            Jwt__Key=${{ secrets.JWT_KEY }}

      - name: Show URL
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
