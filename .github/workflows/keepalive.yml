name: Keep the database awake

# Atlas automatically pauses a free (M0) cluster after 30 days with zero
# connections, so a weekly ping to a database-touching endpoint is enough.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

env:
  # Same project number as in deploy.yml.
  SERVICE_URL: https://skillup-364590748641.europe-west1.run.app

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the health endpoint
        run: |
          code=$(curl -sS -o body.txt -w "%{http_code}" "$SERVICE_URL/api/health" || echo "000")
          echo "HTTP $code"
          cat body.txt 2>/dev/null || true

          if [ "$code" != "200" ]; then
            echo "::error::Health check returned $code - is the Atlas cluster paused?"
            exit 1
          fi

          echo "Database is awake." >> "$GITHUB_STEP_SUMMARY"
          cat body.txt >> "$GITHUB_STEP_SUMMARY"
