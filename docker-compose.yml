services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      args:
        VITE_API_URL: http://localhost:${APP_PORT:-8090}
    image: skillup:local
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MongoDBSettings__ConnectionString: mongodb://mongo:27017
      MongoDBSettings__DatabaseName: SkillupDB
      Jwt__Key: local-development-key-with-at-least-32-characters
      Jwt__Issuer: SkillUpServer
      Jwt__Audience: SkillUpClient
      # The administrator account is created on startup from these values.
      Admin__Email: admin@skillup.local
      Admin__Password: local-admin-password-123
      PORT: "8080"
      SERVER_PORT: "5000"
    ports:
      - "${APP_PORT:-8090}:8080"

volumes:
  mongo-data:
